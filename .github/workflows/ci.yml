name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run pytest

  tag:
    # A push to main with a new version in pyproject.toml gets the tag v<version> and a release.
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
